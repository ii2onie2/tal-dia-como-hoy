name: Daily History Video (Tal Día)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core wget
          pip install -r requirements.txt

      - name: Install Piper TTS
        run: |
          wget https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper_linux_x86_64.tar.gz
          sudo cp piper/piper /usr/local/bin/

      - name: Download Voice Model
        run: |
          mkdir -p voices
          wget -O voices/es_ES-sharvard-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx"
          wget -O voices/es_ES-sharvard-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx.json"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          sleep 5
          ollama pull jobautomation/OpenEuroLLM-Spanish

      - name: Generate Content
        env:
          CONTENT_FILE: "content/episode_$(date +%Y%m%d).json"
        run: |
          python generer_script.py "La Guerre d'Indépendance Espagnole" "$CONTENT_FILE"
          echo "Vérification du fichier généré :"
          ls -la content/
          test -f "$CONTENT_FILE" && echo "FICHIER OK" || echo "FICHIER ABSENT"

      - name: Render Video
        env:
          PIPER_VOICE_MODEL: "voices/es_ES-sharvard-medium.onnx"
          CONTENT_FILE: "content/episode_$(date +%Y%m%d).json"
        run: python scripts/render.py --content "$CONTENT_FILE" --out final_video

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" final_video/video.mp4 --title "Épisode $(date +%d/%m/%Y)"
          echo "VIDEO_URL=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/video.mp4" >> $GITHUB_ENV

      - name: Publish to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python publier.py tal "Découvrez l'histoire du jour. #HistoriaDeEspaña" "$VIDEO_URL"

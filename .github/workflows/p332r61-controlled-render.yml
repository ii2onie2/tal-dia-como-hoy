name: P3.32R61 No-Renderer-On-Denial
on:
  pull_request:
    paths:
      - 'tools/editorial_review/controlled_render_r61.py'
      - 'tools/editorial_review/test_controlled_render_r61.py'
      - '.github/workflows/p332r61-controlled-render.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p332r61-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tools/editorial_review -p 'test_controlled_render_r61.py' -v

name: P3.32R42 Offline MP4 QA Unit Tests
on:
  pull_request:
    paths:
      - 'tools/editorial_review/validate_mp4_artifact.py'
      - 'tools/editorial_review/test_mp4_artifact.py'
      - '.github/workflows/p332r42-mp4-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline MP4 QA tests, ffprobe mocked, no publishing
        run: python3 -m unittest discover -s tools/editorial_review -p 'test_mp4_artifact.py' -v

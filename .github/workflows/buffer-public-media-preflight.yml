name: Buffer public media preflight

on:
  workflow_dispatch:
    inputs:
      video_date:
        description: Existing rendered video date (YYYY-MM-DD)
        required: true
        default: '2026-10-08'

permissions:
  contents: read

jobs:
  media-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate publicly accessible MP4 and construct non-sent draft plan
        env:
          VIDEO_DATE: ${{ inputs.video_date }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, pathlib, sys, urllib.request, urllib.error
          day = os.environ["VIDEO_DATE"]
          try:
              if datetime.date.fromisoformat(day).isoformat() != day:
                  raise ValueError()
          except ValueError:
              sys.exit("FAIL: invalid date")
          stem = day
          files = {
              "video": pathlib.Path("videos") / (stem + ".mp4"),
              "caption": pathlib.Path("videos") / (stem + ".caption.txt"),
              "sources": pathlib.Path("videos") / (stem + ".sources.json"),
              "credits": pathlib.Path("videos") / (stem + ".credits.json"),
          }
          for name, file in files.items():
              if not file.is_file() or file.stat().st_size == 0:
                  sys.exit("FAIL: missing "+name)
          caption = files["caption"].read_text(encoding="utf-8").strip()
          if not caption:
              sys.exit("FAIL: empty caption")
          sources = json.loads(files["sources"].read_text(encoding="utf-8"))
          credits = json.loads(files["credits"].read_text(encoding="utf-8"))
          if not isinstance(sources, list) or not sources:
              sys.exit("FAIL: missing sources")
          if not isinstance(credits, list) or not credits:
              sys.exit("FAIL: missing media rights/credits")
          url = "https://raw.githubusercontent.com/ii2onie2/tal-dia-como-hoy/main/videos/" + stem + ".mp4"
          req = urllib.request.Request(url, headers={"Range": "bytes=0-31", "User-Agent": "Buffer-Media-Preflight/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  status = response.status
                  content_type = response.headers.get("Content-Type", "")
                  sample = response.read(32)
                  if status not in (200, 206) or b"ftyp" not in sample:
                      sys.exit("FAIL: remote content is not an accessible MP4")
                  print("REMOTE_HTTP_STATUS="+str(status))
                  print("REMOTE_CONTENT_TYPE="+content_type)
          except urllib.error.HTTPError as exc:
              sys.exit("FAIL: remote HTTP "+str(exc.code))
          except Exception as exc:
              sys.exit("FAIL: remote request "+type(exc).__name__)
          print("VIDEO_URL_ACCESSIBLE=PASS")
          print("CAPTION_PRESENT=PASS")
          print("SOURCES_JSON_VALID=PASS")
          print("CREDITS_PRESENT=PASS")
          print("TARGET_CHANNEL_ID=6ae070412f1f5ed648e8137f")
          print("DRAFT_INTENT=TRUE")
          print("REQUEST_PREPARED_NOT_SENT=TRUE")
          print("BUFFER_API_REQUESTS=0")
          print("BUFFER_POSTS_CREATED=0")
          print("TIKTOK_PUBLICATIONS=0")
          print("PREFLIGHT=PASS")
          PY

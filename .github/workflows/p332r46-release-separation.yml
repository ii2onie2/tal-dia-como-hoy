name: P3.32R46 Offline Readiness Versus Approval
on:
  pull_request:
    paths:
      - 'tools/editorial_review/test_r46_release_separation.py'
      - 'tools/editorial_review/readiness_preflight.py'
      - '.github/workflows/p332r46-release-separation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-publish-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tools/editorial_review -p 'test_r46_release_separation.py' -v

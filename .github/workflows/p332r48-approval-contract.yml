name: P3.32R48 Offline Approval Contract Tests
on:
  pull_request:
    paths:
      - 'tools/editorial_review/approval_contract_r48.py'
      - 'tools/editorial_review/test_approval_contract_r48.py'
      - '.github/workflows/p332r48-approval-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tools/editorial_review -p 'test_approval_contract_r48.py' -v

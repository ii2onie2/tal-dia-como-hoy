name: Buffer draft readiness (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buffer-tal-dia-2026-10-08-readiness
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify local package and remote MP4 without Buffer mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          day="2026-10-08"
          base=pathlib.Path("videos")/day
          paths=[pathlib.Path(str(base)+suffix) for suffix in (".mp4",".caption.txt",".sources.json")]
          for path in paths:
              if not path.is_file() or path.stat().st_size==0:
                  raise SystemExit("FAIL_MISSING_OR_EMPTY="+str(path))
          text=paths[1].read_text(encoding="utf-8").strip()
          if not text:
              raise SystemExit("FAIL_EMPTY_CAPTION")
          json.loads(paths[2].read_text(encoding="utf-8"))
          url="https://raw.githubusercontent.com/ii2onie2/tal-dia-como-hoy/main/videos/"+day+".mp4"
          req=urllib.request.Request(url,headers={"Range":"bytes=0-31","User-Agent":"BufferDraftReadiness/1.0"})
          with urllib.request.urlopen(req,timeout=25) as resp:
              if resp.status not in (200,206) or b"ftyp" not in resp.read(32):
                  raise SystemExit("FAIL_REMOTE_MP4")
          print("VIDEO_PACKAGE=PASS")
          print("PUBLIC_VIDEO_URL=PASS")
          print("BUFFER_API_REQUESTS=0")
          print("BUFFER_MUTATIONS=0")
          print("TIKTOK_PUBLICATIONS=0")
          print("NEXT=AUTHORIZE_SEPARATE_MUTATION_WORKFLOW_ONLY_AFTER_DUPLICATE_AND_RESPONSE_VALIDATION")
          PY

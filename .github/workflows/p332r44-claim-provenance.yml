name: P3.32R44 Claim Provenance Offline Tests
on:
  pull_request:
    paths:
      - 'tools/editorial_review/validate_claim_provenance_r44.py'
      - 'tools/editorial_review/test_claim_provenance_r44.py'
      - '.github/workflows/p332r44-claim-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tools/editorial_review -p 'test_claim_provenance_r44.py' -v

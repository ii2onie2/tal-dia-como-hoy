name: Render TikTok videos

on:
  workflow_dispatch:
    inputs:
      content_file:
        description: JSON content file to render
        required: true
        default: content/example.json
  push:
    paths:
      - "content/*.json"
      - "scripts/**"
      - ".github/workflows/render.yml"
  schedule:
    - cron: "45 6 * * *"

permissions:
  contents: write

concurrency:
  group: tal-dia-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies and Piper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install piper-tts

      - name: Resolve content files
        id: content
        shell: bash
        run: |
          : > render_list.txt
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE="${{ inputs.content_file }}"
            test -f "$FILE"
            printf '%s\n' "$FILE" >> render_list.txt
          elif [ "${{ github.event_name }}" = "push" ]; then
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > changed_files.txt
            grep -E '^content/20[0-9]{2}-[0-9]{2}-[0-9]{2}(-[A-Za-z0-9_-]+)?\.json$' changed_files.txt >> render_list.txt || true
            if [ ! -s render_list.txt ] && grep -Eq '^(scripts/|\.github/workflows/render\.yml$)' changed_files.txt; then
              LATEST_MAIN=$(find content -maxdepth 1 -type f -name '20??-??-??.json' -print | sort | tail -n 1)
              if [ -n "$LATEST_MAIN" ]; then
                DATE_PREFIX=$(basename "$LATEST_MAIN" .json)
                if [[ "$DATE_PREFIX" > "2026-10-03" ]]; then
                  find content -maxdepth 1 -type f -name "${DATE_PREFIX}*.json" -print | sort >> render_list.txt
                  echo "Technical change smoke test uses ${DATE_PREFIX}"
                else
                  echo "Technical change smoke test skipped: activation starts 2026-10-04"
                fi
              fi
            fi
          else
            TODAY=$(TZ=Europe/Madrid date +%F)
            MAIN="content/${TODAY}.json"
            DETALLE="content/${TODAY}-detalle.json"
            SABIAS="content/${TODAY}-sabias.json"
            test -f "$MAIN"
            test -f "$DETALLE"
            test -f "$SABIAS"
            printf '%s\n' "$MAIN" "$DETALLE" "$SABIAS" >> render_list.txt
          fi
          sort -u -o render_list.txt render_list.txt
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          cat render_list.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Resolved files:"
          cat render_list.txt

      - name: Validate content quality
        if: steps.content.outputs.files != ''
        shell: bash
        run: |
          mapfile -t FILES < render_list.txt
          python scripts/validate_content.py "${FILES[@]}"
          for FILE in "${FILES[@]}"; do
            [ -n "$FILE" ] || continue
            python scripts/select_format.py "$FILE"
          done

      - name: Download Spanish Piper voice
        if: steps.content.outputs.files != ''
        run: |
          mkdir -p voices
          curl -L --fail -o voices/es_ES-sharvard-medium.onnx             https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx
          curl -L --fail -o voices/es_ES-sharvard-medium.onnx.json             https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx.json

      - name: Render all resolved content files
        if: steps.content.outputs.files != ''
        env:
          PIPER_VOICE_MODEL: voices/es_ES-sharvard-medium.onnx
          PIPER_VOICE_CONFIG: voices/es_ES-sharvard-medium.onnx.json
        shell: bash
        run: |
          python scripts/growth_plan.py || true
          mapfile -t FILES < render_list.txt
          for FILE in "${FILES[@]}"; do
            [ -n "$FILE" ] || continue
            STEM=$(basename "$FILE" .json)
            MEDIA_DIR="media/$STEM"
            OUT_DIR="out/$STEM"
            mkdir -p "$MEDIA_DIR" "$OUT_DIR"
            python scripts/fetch_media.py --content "$FILE" --out "$MEDIA_DIR"
            python scripts/render.py --content "$FILE" --out "$OUT_DIR"
            test -s "$OUT_DIR/video.mp4"
            test -s "$OUT_DIR/caption.txt"
            test -s "$OUT_DIR/sources.json"
            DATE_PREFIX="${STEM:0:10}"
            if [[ "$DATE_PREFIX" > "2026-10-03" ]]; then
              DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT_DIR/video.mp4")
              echo "VIDEO_DURATION_SECONDS=$DURATION FILE=$FILE"
              awk -v d="$DURATION" 'BEGIN { exit !(d >= 61.0) }' || {
                echo "DURATION_CHECK=FAIL FILE=$FILE DURATION=$DURATION MIN=61.0"
                exit 1
              }
              echo "DURATION_CHECK=PASS FILE=$FILE DURATION=$DURATION MIN=61.0"
            fi
          done

      - name: Publish rendered MP4s in repository
        if: steps.content.outputs.files != ''
        shell: bash
        run: |
          mkdir -p videos
          mapfile -t FILES < render_list.txt
          for FILE in "${FILES[@]}"; do
            [ -n "$FILE" ] || continue
            STEM=$(basename "$FILE" .json)
            cp "out/$STEM/video.mp4" "videos/$STEM.mp4"
            cp "out/$STEM/caption.txt" "videos/$STEM.caption.txt"
            cp "out/$STEM/sources.json" "videos/$STEM.sources.json"
            if [ -f "media/$STEM/credits.json" ]; then
              cp "media/$STEM/credits.json" "videos/$STEM.credits.json"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree -- content/ || true
          python scripts/update_history.py "${FILES[@]}"
          git add videos/ content/published_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish rendered TikTok videos"
            git pull --rebase origin main
            git push
          fi

      - name: Upload video packages
        if: always() && steps.content.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: tal-dia-como-hoy-${{ github.run_id }}
          path: |
            out/
            media/
          retention-days: 30

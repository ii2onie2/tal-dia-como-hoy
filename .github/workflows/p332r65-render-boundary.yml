name: P3.32R65 Offline Renderer Boundary
on:
  pull_request:
    paths:
      - 'tools/editorial_review/render_boundary_r65.py'
      - 'tools/editorial_review/test_render_boundary_r65.py'
      - '.github/workflows/p332r65-render-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p332r65-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  offline-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tools/editorial_review -p 'test_render_boundary_r65.py' -v

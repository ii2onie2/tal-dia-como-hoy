name: P3.32R9 Editorial Structure Gate (isolated)
on:
  pull_request:
    paths:
      - 'tools/editorial_review/**'
      - '.github/workflows/p332r9-editorial-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate offline gate tests (no network calls in tests)
        run: python3 -m unittest discover -s tools/editorial_review -p 'test_*.py' -v
